services:
  postgres:
    image: postgres:17-alpine
    container_name: go-api-boilerplate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_api_boilerplate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_api_boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
